<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chismes al aire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#0f0e0c;
    --papel:#efe9dc;
    --suave:#a39d90;
    --rojo:#e5402a;
    --vidrio:rgba(239,233,220,.06);
    --borde:rgba(239,233,220,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--fondo);color:var(--papel);
    font-family:'Inter',sans-serif;font-size:17px;line-height:1.5;
    display:flex;justify-content:center;align-items:center;padding:28px 18px}
  main{width:100%;max-width:520px}

  .alaire{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px solid var(--rojo);
    border-radius:6px;color:var(--rojo);font-weight:700;font-size:.8em;letter-spacing:.12em}
  .alaire i{width:9px;height:9px;border-radius:50%;background:var(--rojo);animation:latido 1.6s infinite}
  @keyframes latido{50%{opacity:.25}}

  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:3.4em;line-height:1;margin:22px 0 10px}
  .bajada{color:var(--suave);margin:0 0 24px;font-size:1.05em}

  .tarjeta{background:var(--vidrio);border:1px solid var(--borde);border-radius:20px;padding:20px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  textarea{width:100%;height:170px;background:transparent;border:none;outline:none;resize:none;
    color:var(--papel);font-family:inherit;font-size:1.1em}
  textarea::placeholder{color:var(--suave)}
  .pie{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    color:var(--suave);font-size:.85em}

  button{background:var(--papel);color:var(--fondo);border:none;border-radius:12px;
    padding:14px 22px;font-family:inherit;font-weight:700;font-size:1em;cursor:pointer}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5}
  .ancho{width:100%;margin-top:22px}

  .cuenta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
  .cuenta div{text-align:center}
  .cuenta b{display:block;font-family:'Instrument Serif',serif;font-weight:400;font-size:3em;line-height:1}
  .cuenta span{color:var(--suave);font-size:.8em}
  .aviso{color:var(--suave);margin:0}

  .tiktok{display:block;margin-top:22px;padding:16px;border:1px solid var(--borde);border-radius:12px;
    color:var(--papel);text-decoration:none;text-align:center;font-weight:500}
  .oculto{display:none}
</style>
</head>
<body>
<main>

  <!-- PANTALLA 1: enviar chisme -->
  <section id="pantallaEnviar">
    <span class="alaire"><i></i>AL AIRE PRONTO</span>
    <h1>Contanos el chisme.</h1>
    <p class="bajada">Anónimo de verdad. No pedimos nombre, ni mail, ni nada.</p>
    <div class="tarjeta">
      <textarea id="texto" maxlength="1000" placeholder="¿Qué pasó? Sin nombres reales, eh..."></textarea>
      <div class="pie">
        <span id="contador">0 / 1000</span>
        <button id="btnEnviar" onclick="enviar()">Enviar</button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: después de enviar -->
  <section id="pantallaGracias" class="oculto">
    <span class="alaire"><i></i>RECIBIDO</span>
    <h1>Tu chisme ya está en la fila.</h1>
    <p class="bajada">Quizás lo escuches en el próximo vivo.</p>
    <div class="tarjeta">
      <p class="aviso" id="aviso"></p>
      <div class="cuenta" id="cuenta"></div>
    </div>
    <a class="tiktok" id="linkTiktok" target="_blank">Seguinos en TikTok para no perdértelo</a>
    <button class="ancho" onclick="otro()">Mandar otro chisme</button>
  </section>

</main>

<script>
  // ====== CONFIGURACIÓN (cambiá solo esto) ======
  const FECHA_VIVO = "2026-12-07T21:00:00-03:00";
  const META = 1000;
  const TIKTOK = "https://www.tiktok.com/";
  // ===============================================

  const db = window.supabase.createClient(
    "https://lfwoxdphbowfriqdrezl.supabase.co",
    "sb_publishable_rXxD1ZlBPunQ1YGHhXp93w_5cnA-4Tn"
  );

  const $ = id => document.getElementById(id);
  $("linkTiktok").href = TIKTOK;
  $("texto").addEventListener("input", e => $("contador").innerText = e.target.value.length + " / 1000");

  const fecha = new Date(FECHA_VIVO);
  const dia = fecha.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  const hora = fecha.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  $("aviso").innerText = `Si llegamos a ${META} seguidores, salimos en vivo el ${dia} a las ${hora}.`;

  function actualizarCuenta(){
    const resta = fecha - new Date();
    if(resta <= 0){ $("cuenta").innerHTML = "<div style='grid-column:span 4'><b>¡En vivo!</b></div>"; return; }
    const d = Math.floor(resta/86400000), h = Math.floor(resta/3600000)%24,
          m = Math.floor(resta/60000)%60, s = Math.floor(resta/1000)%60;
    $("cuenta").innerHTML =
      `<div><b>${d}</b><span>días</span></div><div><b>${h}</b><span>horas</span></div>
       <div><b>${m}</b><span>min</span></div><div><b>${s}</b><span>seg</span></div>`;
  }
  setInterval(actualizarCuenta,1000); actualizarCuenta();

  async function enviar(){
    const texto = $("texto").value.trim();
    if(!texto){ alert("Escribí tu chisme primero"); return; }
    $("btnEnviar").disabled = true; $("btnEnviar").innerText = "Enviando...";
    const { error } = await db.from("chismes").insert({ texto });
    $("btnEnviar").disabled = false; $("btnEnviar").innerText = "Enviar";
    if(error){ alert("Hubo un error: " + error.message); return; }
    $("pantallaEnviar").classList.add("oculto");
    $("pantallaGracias").classList.remove("oculto");
    window.scrollTo(0,0);
  }

  function otro(){
    $("texto").value = ""; $("contador").innerText = "0 / 1000";
    $("pantallaGracias").classList.add("oculto");
    $("pantallaEnviar").classList.remove("oculto");
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
