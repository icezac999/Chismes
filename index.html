<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Chismes al aire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#0b0b0c;--blanco:#f4f4f2;--rojo:#ff453a;
  --vidrio:rgba(244,244,242,.06);--linea:rgba(244,244,242,.12);--tenue:rgba(244,244,242,.55);
  --suave:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--negro);color:var(--blanco)}
body{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);
  font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(244,244,242,.07) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed;
}
main{width:100%;max-width:440px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Pantallas */
.pantalla{transition:opacity .45s var(--suave),transform .45s var(--suave)}
.pantalla.fuera{opacity:0;transform:translateY(10px);pointer-events:none}
.oculto{display:none}

/* Encabezado */
.vivo{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--tenue)}
.vivo i{width:7px;height:7px;border-radius:50%;background:var(--rojo);animation:respira 2.4s ease-in-out infinite}
@keyframes respira{50%{opacity:.35}}
h1{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:18px 0 10px}
.sub{color:var(--tenue);margin:0 0 28px}

/* Vidrio */
.vidrio{
  background:var(--vidrio);border:1px solid var(--linea);border-radius:22px;
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  transition:border-color .3s var(--suave);
}
.vidrio:focus-within{border-color:rgba(244,244,242,.3)}

textarea{
  display:block;width:100%;height:180px;padding:20px 20px 0;
  background:none;border:0;outline:0;resize:none;
  color:var(--blanco);font:inherit;font-size:17px;
}
textarea::placeholder{color:rgba(244,244,242,.35)}
.barra{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 20px}
#contador{font-size:13px;color:var(--tenue);font-variant-numeric:tabular-nums;transition:color .3s}
#contador.limite{color:var(--rojo)}

button,.boton{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border:0;border-radius:14px;
  background:var(--blanco);color:var(--negro);font:inherit;font-weight:600;font-size:15px;
  text-decoration:none;cursor:pointer;
  transition:transform .2s var(--suave),opacity .2s;
}
button:active,.boton:active{transform:scale(.97)}
button:disabled{opacity:.5}
.secundario{background:var(--vidrio);color:var(--blanco);border:1px solid var(--linea);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.ancho{width:100%;height:52px}
.giro{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Confirmación */
.tilde{width:44px;height:44px;color:var(--blanco)}
.tilde path{stroke-dasharray:30;stroke-dashoffset:30}
.ver .tilde path{transition:stroke-dashoffset .6s .15s var(--suave);stroke-dashoffset:0}
.aviso{color:var(--tenue);margin:0;padding:20px 20px 0;font-size:15px}
.cuenta{display:grid;grid-template-columns:repeat(4,1fr);padding:16px 8px 20px}
.cuenta div{text-align:center}
.cuenta b{display:block;font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cuenta span{font-size:12px;color:var(--tenue)}
.acciones{display:grid;gap:10px;margin-top:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>

<section id="enviar" class="pantalla">
  <span class="vivo"><i></i>AL AIRE PRONTO</span>
  <h1>Contanos el chisme.</h1>
  <p class="sub">Anónimo. Sin nombre, sin mail, sin nada.</p>
  <div class="vidrio">
    <textarea id="texto" maxlength="1000" placeholder="¿Qué pasó?"></textarea>
    <div class="barra">
      <span id="contador">0 / 1000</span>
      <button id="btn" onclick="enviar()">Enviar</button>
    </div>
  </div>
</section>

<section id="gracias" class="pantalla fuera oculto">
  <svg class="tilde" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <h1>Recibido.</h1>
  <p class="sub">Tu chisme está en la fila. Capaz lo escuchás en el próximo vivo.</p>
  <div class="vidrio">
    <p class="aviso" id="aviso"></p>
    <div class="cuenta" id="cuenta">
      <div><b id="d">0</b><span>días</span></div>
      <div><b id="h">0</b><span>horas</span></div>
      <div><b id="m">0</b><span>min</span></div>
      <div><b id="s">0</b><span>seg</span></div>
    </div>
  </div>
  <div class="acciones">
    <a class="boton secundario ancho" id="tiktok" target="_blank" rel="noopener">Seguinos en TikTok</a>
    <button class="ancho" onclick="otro()">Mandar otro</button>
  </div>
</section>

</main>
<script>
// ====== CONFIGURACIÓN ======
const FECHA_VIVO = "2026-12-07T21:00:00-03:00";
const META = 1000;
const TIKTOK = "https://www.tiktok.com/";
// ===========================

const db=window.supabase.createClient("https://lfwoxdphbowfriqdrezl.supabase.co","sb_publishable_rXxD1ZlBPunQ1YGHhXp93w_5cnA-4Tn");
const $=id=>document.getElementById(id);

$("tiktok").href=TIKTOK;
$("texto").addEventListener("input",e=>{
  const n=e.target.value.length;
  $("contador").textContent=n+" / 1000";
  $("contador").classList.toggle("limite",n>900);
});

const fecha=new Date(FECHA_VIVO);
const dia=fecha.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
const hora=fecha.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
$("aviso").textContent=`Si llegamos a ${META} seguidores, salimos en vivo el ${dia} a las ${hora}.`;

function cuenta(){
  const r=fecha-new Date();
  if(r<=0){$("cuenta").innerHTML="<div style='grid-column:span 4'><b>En vivo</b></div>";return;}
  $("d").textContent=Math.floor(r/864e5);
  $("h").textContent=Math.floor(r/36e5)%24;
  $("m").textContent=Math.floor(r/6e4)%60;
  $("s").textContent=Math.floor(r/1e3)%60;
}
setInterval(cuenta,1000);cuenta();

function ir(de,a){
  $(de).classList.add("fuera");
  setTimeout(()=>{
    $(de).classList.add("oculto");$(de).classList.remove("ver");
    $(a).classList.remove("oculto");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{$(a).classList.remove("fuera");$(a).classList.add("ver");}));
    window.scrollTo(0,0);
  },300);
}

async function enviar(){
  const texto=$("texto").value.trim();
  if(!texto){$("texto").focus();return;}
  const b=$("btn");b.disabled=true;b.innerHTML='<span class="giro"></span>';
  const {error}=await db.from("chismes").insert({texto});
  b.disabled=false;b.textContent="Enviar";
  if(error){
    alert(error.message.includes("Demasiados")?"Mandaste muchos seguidos. Esperá un minuto.":"Hubo un error, probá de nuevo.");
    return;
  }
  ir("enviar","gracias");
}

function otro(){
  $("texto").value="";$("contador").textContent="0 / 1000";$("contador").classList.remove("limite");
  ir("gracias","enviar");
}
</script>
</body>
</html>
